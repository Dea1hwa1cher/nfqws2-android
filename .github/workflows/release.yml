# Выпуск релиза по тегу: git tag v1.6.3 && git push origin v1.6.3
# или вручную: Actions → release → Run workflow, указав версию (тег тогда
# создаётся на текущем коммите main).
#
# Собирает установочный zip из файлов модуля (тот же состав, что и раньше
# собирался вручную: без tests/, docs/, .github/ и прочего), публикует релиз с
# текстом из changelog.md и сразу обновляет update.json в main, чтобы менеджер
# предложил обновление. Отдельный workflow update-json здесь не сработает:
# релиз, созданный токеном Actions, не запускает другие workflow.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Версия релиза, как в module.prop (например v1.6.3)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия в module.prop совпадает с тегом
        run: |
          ver=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          [ "$ver" = "$TAG" ] || { echo "::error::module.prop: version=$ver, а тег $TAG"; exit 1; }

      - name: Собрать zip
        run: |
          set -eu
          out="nfqws2-android-$TAG.zip"
          zip -q -r -9 -X "$out" \
            module.prop customize.sh service.sh action.sh uninstall.sh README.md LICENSE \
            bin binaries blobs defaults lib lists lua strategies webroot
          unzip -l "$out" | tail -n 1
          echo "ZIP=$out" >> "$GITHUB_ENV"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Релиз уже создан вручную через сайт (это тоже пуш тега): только
          # докладываем zip, если его там нет. При ручном повторном запуске
          # заодно обновляем текст релиза из changelog.md.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '\.zip$'; then
              echo "zip уже приложен"
            else
              gh release upload "$TAG" "$ZIP"
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              gh release edit "$TAG" --notes-file changelog.md
            fi
          else
            # По тегу — тег уже есть; при ручном запуске gh создаст его на этом коммите
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file changelog.md --target "$GITHUB_SHA"
          fi

      - name: Обновить update.json в main
        run: |
          set -eu
          git fetch origin main
          git checkout -B main origin/main
          code=$(git show "$GITHUB_SHA:module.prop" | sed -n 's/^versionCode=//p' | tr -d '\r')
          jq -n --arg v "$TAG" --argjson c "$code" \
                --arg z "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ZIP" \
                --arg l "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/changelog.md" \
                '{version: $v, versionCode: $c, zipUrl: $z, changelog: $l}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "update.json: $TAG"
          git push origin HEAD:main
