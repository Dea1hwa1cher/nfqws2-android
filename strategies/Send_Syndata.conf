                 --blob=syn_packet:@$BLOBS_DIR/syn_packet.bin
                 --blob=t2:@$BLOBS_DIR/t2.bin
                 --blob=stun:@$BLOBS_DIR/stun.bin
                 --blob=fake_default_tls:@$BLOBS_DIR/tls_clienthello.bin
                 --blob=tls_clienthello_www_google_com:@$BLOBS_DIR/tls_clienthello_www_google_com.bin
                 --blob=tls_clienthello_4pda_to:@$BLOBS_DIR/tls_clienthello_4pda_to.bin
                 --blob=tls_clienthello_activated:@$BLOBS_DIR/tls_clienthello_activated.bin
                 --blob=tls_clienthello_gosuslugi_ru:@$BLOBS_DIR/tls_clienthello_gosuslugi_ru.bin
